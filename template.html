<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UCR Science Gallery: Master Index</title>
    <style>
        body { font-family: sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; background: #f4f4f4; }
        h1 { text-align: center; color: #003087; border-bottom: 4px solid #F1AB00; padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .domain-tag { display: inline-block; background: #eee; padding: 2px 8px; border-radius: 4px; font-size: 0.8em; color: #555; margin-bottom: 10px; }
        h3 { margin: 0 0 10px 0; font-size: 1.1em; color: #333; }
        a { text-decoration: none; color: inherit; }
        .btn { display: inline-block; margin-top: 10px; padding: 5px 10px; background: #007bff; color: white; border-radius: 4px; font-size: 0.9em; }
        .footer { margin-top: 40px; text-align: center; color: #777; }
    </style>
</head>
<body>
    <h1>UCR HPC Job Gallery</h1>
    <p style="text-align: center;">A collection of 100+ Autonomous Scientific Workflows</p>
    <div class="grid" id="gallery-grid">
        <!-- Python script will inject content here -->
    </div>
    <div class="footer">
        Generated by ClusterBot | University of California, Riverside
    </div>
</body>
</html>
